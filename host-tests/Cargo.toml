# Runs the hardware-independent firmware modules' unit tests on the host:
#
#     cd host-tests && cargo test --target "$(rustc -vV | sed -n 's/host: //p')"
#
# The target must be given because the firmware's .cargo/config.toml defaults to the ESP32-C6.
[package]
edition = "2024"
name    = "host-tests"
publish = false
version = "0.1.0"

[dependencies]
libm       = "0.2.16"
serde      = { version = "1.0", default-features = false, features = ["derive"] }
serde_json = { version = "1.0.154", default-features = false, features = ["alloc"] }
