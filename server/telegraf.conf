# Bridges the blinds' MQTT topics into InfluxDB Cloud. See docs/server-setup.md.
#
# Run with ./server/run-telegraf.sh, which loads the credentials from server/.env.

[agent]
  interval = "5s"
  flush_interval = "5s"
  # The host is this laptop, which is no use as a tag.
  omit_hostname = true
  skip_processors_after_aggregators = true

[[inputs.mqtt_consumer]]
  servers = ["tcp://broker.emqx.io:1883"]
  topics = [
    "jacob-brendan/smartblind/+/telemetry",
    "jacob-brendan/smartblind/+/status",
  ]
  qos = 0
  data_format = "json"
  # The measurement and device tag below already cover the topic.
  topic_tag = ""

  # Measurement from the last topic level, device tag from the ID level.
  [[inputs.mqtt_consumer.topic_parsing]]
    topic = "jacob-brendan/smartblind/+/+"
    measurement = "_/_/_/measurement"
    tags = "_/_/device/_"

[[outputs.influxdb_v2]]
  urls = ["${INFLUX_URL}"]
  token = "${INFLUX_TOKEN}"
  organization = "${INFLUX_ORG}"
  bucket = "${INFLUX_BUCKET}"
